name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Conferir versao do setup.php com a tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SETUP_VERSION=$(grep -oP "PLUGIN_TICKETRULES_VERSION', '\K[^']+" ticketrules/setup.php)
          echo "Tag: $TAG_VERSION | setup.php: $SETUP_VERSION"
          test "$TAG_VERSION" = "$SETUP_VERSION"

      - name: Gerar o pacote
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp LICENSE README.md CHANGELOG.md ticketrules/
          zip -r "ticketrules-$VERSION.zip" ticketrules
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publicar a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(awk -v ver="$VERSION" '/^## \[/{if(f)exit} index($0,"## [" ver "]")==1{f=1;next} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "ticketrules-$VERSION.zip" \
            --title "Ticket Rules $VERSION" --notes "$NOTES"